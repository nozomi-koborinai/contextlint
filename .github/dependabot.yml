version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        # Also listed in requires_manual_review in dependabot-auto-merge.yml. Those PRs are never auto-merged.
        exclude-patterns:
          - "@astrojs/starlight"
          - "starlight-llms-txt"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
