name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          set -euo pipefail

          # fetch-metadata joins dependency-names with ", ".
          # Comma boundaries make this an exact name match.
          # Same names as dependabot.yml exclude-patterns. This job must not read that file.
          requires_manual_review() {
            local normalized=",$(printf '%s' "$1" | tr -d '[:space:]'),"
            case "$normalized" in
              *',@astrojs/starlight,'*|*',starlight-llms-txt,'*)
                return 0
                ;;
            esac
            return 1
          }

          if requires_manual_review "$DEPENDENCY_NAMES"; then
            echo "Manual review required for ${DEPENDENCY_NAMES}."
            exit 0
          fi

          state="$(gh pr view "$PR_URL" --json state --jq .state)"
          if [ "$state" != "OPEN" ]; then
            echo "Pull request is ${state}."
            exit 0
          fi
          already="$(gh pr view "$PR_URL" --json autoMergeRequest --jq 'if .autoMergeRequest == null then "no" else "yes" end')"
          if [ "$already" = "yes" ]; then
            echo "Auto-merge is already enabled."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
