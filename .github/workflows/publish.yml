name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run --filter '*' build

      - run: bun test

      - name: Set version and resolve workspace dependencies
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          for pkg in packages/*/; do
            (cd "$pkg" && npm pkg set "version=${VERSION}")
          done
          sed -i 's/"workspace:\*"/"'"${VERSION}"'"/g' packages/*/package.json

      - name: Publish to npm
        run: |
          for pkg in packages/*/; do
            if [ "$(jq -r '.private // false' "$pkg/package.json")" = "true" ]; then
              echo "Skipping private package: $pkg"
              continue
            fi
            (cd "$pkg" && bun publish --no-git-checks --access public)
          done
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package VS Code extension
        run: |
          package_dir="$(mktemp -d)"
          cp -R packages/vscode/. "$package_dir/"
          npm pack --pack-destination "$package_dir" ./packages/core
          npm pack --pack-destination "$package_dir" ./packages/lsp-server
          cd "$package_dir"
          npm pkg set "version=${VERSION}"
          npm pkg set "dependencies.@contextlint/lsp-server=./contextlint-lsp-server-${VERSION}.tgz"
          npm pkg set "overrides.@contextlint/core=./contextlint-core-${VERSION}.tgz"
          npm install --omit=dev --ignore-scripts --package-lock=false
          npx --yes @vscode/vsce package \
            --out "${GITHUB_WORKSPACE}/contextlint-vscode-${VERSION}.vsix"

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: contextlint-vscode-*.vsix
          generate_release_notes: true
